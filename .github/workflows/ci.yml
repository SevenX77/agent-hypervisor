name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI 物理上无 codex/gemini/claude binary + OAuth + user-systemd，真 provider
      # smoke 测试（tests/mvp{7,8,9,11}_real_*.rs）在函数首行据此显式早返，避免
      # hard_gate 在缺 provider 时 assert panic。抓 PR4a 生命周期 regression 的确定性
      # 测试（pr4a_lifecycle_contract / prompt_handler_e2e mock 管道 / ack_fallback /
      # lib 单测）不读此变量、仍在 CI 真跑。真 provider 验证是终极达成门，留本地/VPS。
      # 三方（a1/a2/a3）收敛 2026-05-25：显式 env-gated 早返 ≠ 假绿（物理约束诚实声明）。
      CCB_TEST_SKIP_REAL_PROVIDER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap tmux

      - name: Enable unprivileged user namespaces (bwrap sandbox exec tests)
        # ubuntu-latest (24.04) 默认 kernel.apparmor_restrict_unprivileged_userns=1，
        # 使 bwrap --unshare-* 在建 uid map 时 "Permission denied"，真正执行 bwrap 的
        # 沙箱隔离测试（r3_bwrap_workspace / r1_r3_joint）跑不起来。bwrap 是安全关键功能，
        # 三方（a1/a2/a3）收敛 2026-05-25：内核特性物理存在、只被宿主安全策略屏蔽，属
        # "环境预热"，应让 bwrap 在 CI 真跑验隔离契约（ro-bind .git / workspace chdir），
        # 而非 gate-skip（skip 安全关键沙箱测试 = 假绿）。
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build
        run: cargo build

      # 感知写入仲裁的 grep 闸:agents.state 只允许 db/perception/gate.rs 写。
      # 单独成步是为了让越权写入在日志里一眼可见,而不是淹没在测试输出里。
      - name: Check agents.state write gate
        run: bash scripts/ci/check_state_write_gate.sh

      - name: Test
        run: cargo test --all-targets

      - name: Check tmux orphan guard
        run: cargo test --test mvp10_acceptance test_no_orphan_tmux_after_test_suite -- --ignored --nocapture

  macos-check:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check --all-targets

      - name: Test mac platform lib
        run: RUST_BACKTRACE=1 cargo test --lib platform::macos

  windows-conpty-spike:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run ConPTY spike
        run: cargo test --manifest-path tests/windows_conpty_spike/Cargo.toml -- --nocapture

  windows-msvc-check:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Check Windows target
        run: cargo check --all-targets --target x86_64-pc-windows-msvc

  windows-req1-phase2-mock:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PowerShell test modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester
          Import-Module PSScriptAnalyzer

      - name: Analyze Windows provisioning scripts
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path scripts/windows -Recurse -Severity Error

      - name: Run Req1 Phase 2 mock tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/windows/Req1Phase2.Tests.ps1'
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  req1-installer-landing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-dist
        run: cargo install cargo-dist --version 0.32.0 --locked

      - name: Build cargo-dist artifacts
        run: |
          dist build --artifacts=local
          dist build --artifacts=global

      - name: Verify installer lands in AH_INSTALL_DIR
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          HOME="$tmp" \
            AH_INSTALL_DIR="$tmp/.local" \
            AH_NO_MODIFY_PATH=1 \
            AH_DOWNLOAD_URL="file://$PWD/target/distrib" \
            sh target/distrib/ah-installer.sh
          "$tmp/.local/bin/ah" --version
          test ! -e "$tmp/.cargo/bin/ah"
