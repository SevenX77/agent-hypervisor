version = "1"

# Required whenever a seat runs `claude` — including the master, which runs
# `claude` unless you set `[master] enabled = false` or change `master.cmd`.
# Replace with the absolute path of your own host Claude login directory.
[providers.claude]
shared_credentials_dir = "~/.claude"

[env]
PROJECT_ROOT = "/tmp/ccbd-example"

[agents.a1]
provider = "bash"

[agents.a2]
provider = "bash"

[agents.review]
provider = "bash"
